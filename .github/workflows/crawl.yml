# .github/workflows/crawl_and_email.yml

name: 今日热榜

on:
  repository_dispatch:
    types: [trigger-crawl]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: 运行爬虫脚本
      env:
        PAT: ${{ secrets.GH_PAT }}
        REPO: ${{ secrets.GH_REPO }}
      run: python main.py

    - name: 执行结果
      if: always()
      run: |
        echo "工作流执行完成"
        echo "执行时间：$(date)"